<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reader — RSS</title>
<meta name="color-scheme" content="light dark">
<script>
  (() => {
    try {
      const saved = localStorage.getItem('rss-theme');
      const theme = saved || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.dataset.theme = theme;
    } catch { document.documentElement.dataset.theme = 'light'; }
  })();
</script>
<link rel="stylesheet" href="/style.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23e05d2b'/%3E%3Cpath d='M9 23a2 2 0 100-4 2 2 0 000 4zm-2-7a9 9 0 019 9M7 9a16 16 0 0116 16' fill='none' stroke='%23fff' stroke-width='2.4' stroke-linecap='round'/%3E%3C/svg%3E">
</head>
<body>
<div class="app" id="app">

  <!-- ---------------------------------------------------------------- -->
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
          <path d="M6 18a1.5 1.5 0 1 0 0 0.01"/><path d="M4 11a9 9 0 0 1 9 9"/><path d="M4 4a16 16 0 0 1 16 16"/>
        </svg>
      </span>
      <span class="brand-name">Reader</span>
      <button class="icon-btn theme-btn" id="themeBtn" title="Toggle theme" aria-label="Toggle theme">
        <svg class="ico-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
        </svg>
        <svg class="ico-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>
        </svg>
      </button>
    </div>

    <form class="add-form" id="addForm" autocomplete="off">
      <input id="feedUrl" name="url" type="text" placeholder="Paste RSS or site link…" spellcheck="false" aria-label="Feed URL">
      <button type="submit" id="addBtn" title="Add feed" aria-label="Add feed">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      </button>
    </form>
    <div class="add-error" id="addError" hidden></div>

    <nav class="filters" aria-label="Views">
      <button class="filter" data-filter="all">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
        <span>All articles</span><span class="count" id="countAll">0</span>
      </button>
      <button class="filter" data-filter="unread">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="8"/><path d="M12 8v4l2.5 2.5"/></svg>
        <span>Unread</span><span class="count" id="countUnread">0</span>
      </button>
      <button class="filter" data-filter="starred">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 4l2.4 5 5.6.7-4.1 3.8 1.1 5.5L12 16.4 7 19l1.1-5.5L4 9.7 9.6 9z"/></svg>
        <span>Starred</span><span class="count" id="countStarred">0</span>
      </button>
    </nav>

    <div class="section-head">
      <span>Feeds</span>
      <button class="icon-btn" id="refreshAll" title="Refresh all feeds" aria-label="Refresh all feeds">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 3v6h-6"/>
        </svg>
      </button>
    </div>

    <ul class="feed-list" id="feedList"></ul>

    <div class="suggestions" id="suggestions" hidden>
      <p class="suggest-title">Try one of these</p>
      <div class="chips" id="suggestChips"></div>
    </div>

    <div class="sidebar-foot" id="sidebarFoot"></div>
  </aside>

  <!-- ---------------------------------------------------------------- -->
  <main class="list-pane" id="listPane">
    <header class="list-head">
      <button class="icon-btn menu-btn" id="menuBtn" aria-label="Open sidebar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
      <div class="list-title-wrap">
        <h1 id="listTitle">All articles</h1>
        <div class="list-sub" id="listSub"></div>
      </div>
      <div class="list-tools">
        <label class="search">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
          <input id="search" type="search" placeholder="Search" aria-label="Search articles" spellcheck="false">
        </label>
        <button class="text-btn" id="markAllBtn" title="Mark everything in this view as read">Mark all read</button>
      </div>
    </header>

    <div class="list-scroll" id="listScroll">
      <ul class="item-list" id="itemList"></ul>
      <div class="empty" id="emptyState" hidden></div>
      <div class="list-loading" id="listLoading" hidden><span class="spinner"></span></div>
    </div>
  </main>

  <!-- ---------------------------------------------------------------- -->
  <section class="reader" id="reader">
    <header class="reader-head">
      <button class="icon-btn back-btn" id="backBtn" aria-label="Back to list">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
      </button>
      <div class="reader-crumbs" id="readerCrumbs"></div>
      <div class="reader-actions">
        <button class="icon-btn star-btn" id="starBtn" title="Star (s)" aria-label="Star article">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"><path d="M12 4l2.4 5 5.6.7-4.1 3.8 1.1 5.5L12 16.4 7 19l1.1-5.5L4 9.7 9.6 9z"/></svg>
        </button>
        <button class="text-btn" id="readBtn">Mark unread</button>
        <a class="text-btn primary" id="openOriginal" target="_blank" rel="noopener noreferrer">
          Open original
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 5h5v5M19 5l-8 8M18 14v4a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h4"/></svg>
        </a>
      </div>
    </header>

    <div class="reader-scroll" id="readerScroll">
      <div class="reader-placeholder" id="readerPlaceholder">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
          <path d="M6 3h9l4 4v14H6z" opacity=".5"/><path d="M15 3v4h4"/><path d="M9 12h7M9 16h5" opacity=".7"/>
        </svg>
        <p>Pick an article to read</p>
        <span>Use <kbd>j</kbd> / <kbd>k</kbd> to move, <kbd>Enter</kbd> to open</span>
      </div>

      <article class="reader-article" id="readerArticle" hidden>
        <div class="reader-meta" id="readerMeta"></div>
        <h2 class="reader-title" id="readerTitle"></h2>
        <div class="reader-byline" id="readerByline"></div>
        <iframe id="readerFrame" class="reader-frame" title="Article content"
                sandbox="allow-popups allow-popups-to-escape-sandbox"></iframe>
      </article>
    </div>
  </section>

  <div class="backdrop" id="backdrop" hidden></div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="/app.js"></script>
</body>
</html>
